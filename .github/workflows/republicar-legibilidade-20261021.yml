name: Republicar slides com legibilidade revisada
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/republicar-legibilidade-20261021.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atualizacao-seminario-20261021
  cancel-in-progress: false
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Carregar versão atual do repositório
        uses: actions/checkout@v4

      - name: Receber versões finais e verificar integridade
        shell: bash
        env:
          STAGING: https://nodes-regularly-acids-airlines.trycloudflare.com
        run: |
          set -euo pipefail
          BASE=Apresentacao_Economia_Brasileira_II_Especulacao_Financeira_nos_Anos_1980
          for name in index.html "$BASE.pptx" "$BASE.pdf"; do
            curl --fail --location --show-error --retry 5 --retry-delay 3 --connect-timeout 15 "$STAGING/$name" --output "$name"
          done
          printf '%s  %s\n' \
            '4dff3479a587955c0ce03ebb27905252c657ec3485ee74a6b207364fb2a7e5eb' index.html \
            '0e6330f3c636164f16fc28dbabf94d74a52fc7f2e1db1f8d644af9c955ecab22' "$BASE.pptx" \
            '47ad572fa7dfc8852c5ee99e96885751f9f2772a32732673d906201a33d9e2d2' "$BASE.pdf" | sha256sum --check
          test -s guia-estudo-alexandre.html
          touch .nojekyll

      - name: Integrar diretamente na main os três arquivos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=Apresentacao_Economia_Brasileira_II_Especulacao_Financeira_nos_Anos_1980
          git add index.html "$BASE.pptx" "$BASE.pdf"
          git diff --cached --quiet && { echo "Arquivos já idênticos no repositório"; exit 0; }
          git commit -m "Corrige separadores do sumário e nomes dos seminaristas"
          git push origin HEAD:main

      - name: Aguardar finalização de publicação simultânea
        run: sleep 45

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar pacote estático completo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html *.pptx *.pdf guia-estudo-alexandre.html .nojekyll site/
          test -s site/index.html
          test -s site/guia-estudo-alexandre.html

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Atualizar publicação GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
