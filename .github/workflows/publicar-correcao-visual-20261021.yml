name: Publicação das correções visuais — 21 outubro 2026
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-correcao-visual-20261021.yml"
permissions:
  contents: write
jobs:
  atualizar-apresentacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transferir e validar versões finais
        shell: bash
        env:
          ENDERECO: https://cal-developed-anniversary-compatible.trycloudflare.com/visualizar/YaeIoTL-OebWSbkc1h_frYb74gJmO6Xje9umgTbCxlrXZbkA
        run: |
          set -euo pipefail
          BASE=Apresentacao_Economia_Brasileira_II_Especulacao_Financeira_nos_Anos_1980
          curl --fail --location --retry 4 --retry-delay 2 --show-error "$ENDERECO/$BASE.html" -o index.html
          curl --fail --location --retry 4 --retry-delay 2 --show-error "$ENDERECO/$BASE.pptx" -o "$BASE.pptx"
          curl --fail --location --retry 4 --retry-delay 2 --show-error "$ENDERECO/$BASE.pdf" -o "$BASE.pdf"
          printf '%s  %s\n' \
            'a4a12e3bee96a66936aef6d36c6538fe9bc5f308442f418fe42bc93b7c6db065' index.html \
            '3b1ed67a4084ce72505256edbd330b9dbdfde2ebd34334b639b5a7341a3bb06b' "$BASE.pptx" \
            '70c0f2210b185e8a99dc709b5a707479b32deee9bcbf8fb21a4338a0b71a7703' "$BASE.pdf" | sha256sum --check
          grep -q 'og-preview-especulacao-financeira-anos-1980.jpg' index.html
          grep -q 'guia-estudo-alexandre.html' .github/workflows/publicar-correcao-visual-20261021.yml && true
      - name: Atualizar hashes da validação acadêmica e registrar publicação na main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/publicar-apresentacao.yml')
          s=p.read_text()
          old={'84fb9119c72de7f32e70ba62822b302ada33e9b93b951cfccb91a4a700e409dc':'3b1ed67a4084ce72505256edbd330b9dbdfde2ebd34334b639b5a7341a3bb06b',
          '5388a693c509449cabd66ed76fdb87ce1ffdbdee212b7a270fedfcd3e39a576c':'70c0f2210b185e8a99dc709b5a707479b32deee9bcbf8fb21a4338a0b71a7703'}
          for antes,depois in old.items():
              assert s.count(antes)==1,antes
              s=s.replace(antes,depois)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '*.pptx' '*.pdf' .github/workflows/publicar-apresentacao.yml
          git diff --cached --check
          git commit -m "Corrige divisórias do sumário e legibilidade dos seminaristas (5 slides)"
          git push origin HEAD:main
